services:
  - type: web
    name: ai-export-sales-network
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_VERSION
        value: 1.1.0
      - key: PORT
        value: 10000
      - key: ADMIN_TOKEN
        sync: false
      - key: AGENT_APPROVER_TOKEN
        sync: false
      - key: AGENT_CRON_TOKEN
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        value: gpt-4.1-mini
      - key: AI_WEB_SEARCH
        value: true
      - key: SEARCH_PROVIDER
        value: serpapi
      - key: SEARCH_API_KEY
        sync: false
      - key: SEARCH_BASE_URL
        value: https://serpapi.com/search.json
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: true
      - key: PUBLIC_BASE_URL
        value: https://ai-export-sales-network.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: ai-export-sales-network-db
          property: connectionString

databases:
  - name: ai-export-sales-network-db
    plan: free
    region: frankfurt
    databaseName: export_sales
    user: export_sales
